name: API Pipeline PHP-Rust Audit

# Hosted runners are an explicit fallback only. Local CI is the canonical
# PHP route -> OpenAPI -> Rust -> Tauri static hard gate.
on:
  workflow_dispatch:

jobs:
  integrated-audit:
    name: PHP route · OpenAPI · Rust · Tauri static hard gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Rust
        uses: actions/checkout@v4
        with:
          path: rust

      - name: Checkout PHP
        uses: actions/checkout@v4
        with:
          repository: jiwonpapa/gnubard5restapi-php
          path: php

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit Python dependencies
        run: |
          python -m pip install \
            --requirement rust/scripts/requirements-audit.txt \
            --requirement rust/scripts/requirements-audit-dev.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Install Rust frontend dependencies
        working-directory: rust/g5-admin
        run: bun install --frozen-lockfile

      - name: Install PHP dependencies
        run: composer --working-dir=php install --no-interaction --no-progress --prefer-dist

      - name: Run audit harness regression and quality gates
        run: |
          python3 -m unittest discover -s rust/scripts/tests -p 'test_*.py'
          ruff check --config rust/pyproject.toml \
            rust/scripts/audit_harness \
            rust/scripts/run_api_pipeline_audit.py \
            rust/scripts/run_integrated_audit.py \
            rust/scripts/tests/test_audit_harness_execution.py \
            rust/scripts/tests/test_run_api_pipeline_audit.py
          mypy --config-file rust/pyproject.toml rust/scripts/audit_harness

      - name: Run API pipeline static audit
        run: |
          python3 rust/scripts/run_api_pipeline_audit.py \
            --rust-root "$GITHUB_WORKSPACE/rust" \
            --php-root "$GITHUB_WORKSPACE/php" \
            --static-only \
            --output-json "$GITHUB_WORKSPACE/output/api-pipeline-audit/latest.json" \
            --output-md "$GITHUB_WORKSPACE/output/api-pipeline-audit/latest.md"

      - name: Upload API pipeline audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-pipeline-php-rust-audit
          path: output/api-pipeline-audit/
