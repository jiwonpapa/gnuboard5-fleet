<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gnuboard5 REST API</title>
    <link rel="stylesheet" href="/api/docs/swagger-ui/swagger-ui.css" />
    <style>
      body { margin: 0; }
      .loading {
        color: #4a5568;
        display: none;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        padding: 14px 18px;
      }
      body[data-loading='true'] .loading {
        display: block;
      }
      .loading p { margin: 0 0 4px; }
    </style>
  </head>
  <body data-loading="true">
    <div id="swagger-ui"></div>
    <div class="loading">Swagger UI loading...</div>

    <script src="/api/docs/swagger-ui/swagger-ui-bundle.js"></script>
    <script src="/api/docs/swagger-ui/swagger-ui-standalone-preset.js"></script>
    <script>
      const specUrl = new URL('openapi.yaml', window.location.href).toString();

      window.onload = function() {
        window.ui = SwaggerUIBundle({
          url: specUrl,
          dom_id: '#swagger-ui',
          deepLinking: true,
          docExpansion: 'none',
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset,
          ],
          layout: 'StandaloneLayout',
        });
        document.body.dataset.loading = 'false';
      };
    </script>
  </body>
</html>
