name: PHP Rust Integrated Audit

# Hosted runners are an explicit fallback only. Run `composer run ci:local`
# for the canonical PHP-Rust integrated gate.
on:
  workflow_dispatch:

jobs:
  integrated-audit:
    name: PHP · Rust Integrated Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PHP
        uses: actions/checkout@v4
        with:
          path: php

      - name: Checkout Rust
        uses: actions/checkout@v4
        with:
          repository: jiwonpapa/g5-rust-admin
          path: rust

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install Rust frontend dependencies
        working-directory: rust/g5-admin
        run: bun install --frozen-lockfile

      - name: Install PHP dependencies
        run: composer --working-dir=php install --no-interaction --no-progress --prefer-dist

      - name: Install PHP audit harness quality tools
        run: python -m pip install --requirement php/tools/requirements-audit-dev.txt

      - name: Run PHP audit harness regression and quality gates
        run: composer --working-dir=php run audit:harness

      - name: Run integrated audit
        run: |
          python3 rust/scripts/run_integrated_audit.py \
            --rust-root "$GITHUB_WORKSPACE/rust" \
            --php-root "$GITHUB_WORKSPACE/php" \
            --output-json "$GITHUB_WORKSPACE/output/integrated-audit/latest.json" \
            --output-md "$GITHUB_WORKSPACE/output/integrated-audit/latest.md"

      - name: Upload integrated audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-rust-integrated-audit
          path: output/integrated-audit/
