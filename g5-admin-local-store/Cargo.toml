[package]
name = "g5-admin-local-store"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.11"
dirs = "6"
g5-admin-port-types = { path = "../g5-admin-port-types" }
g5-admin-runtime-types = { path = "../g5-admin-runtime-types" }
keyring = "4"
getrandom = "0.4"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
