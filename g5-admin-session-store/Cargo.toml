[package]
name = "g5-admin-session-store"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"

[dependencies]
dirs = "6"
g5-admin-runtime-types = { path = "../g5-admin-runtime-types" }
keyring = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
uuid = { version = "1", features = ["v4"] }
