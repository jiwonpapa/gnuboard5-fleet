[package]
name = "g5-admin-api-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
g5-admin-models = { path = "../g5-admin-models" }
g5-admin-transport = { path = "../g5-admin-transport" }
reqwest = { version = "0.13", features = ["json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
