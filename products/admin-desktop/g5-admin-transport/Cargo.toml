[package]
name = "g5-admin-transport"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
g5-admin-error-contract = { path = "../g5-admin-error-contract" }
g5-admin-port-types = { path = "../g5-admin-port-types" }
reqwest = { version = "0.13", features = ["json", "multipart", "native-tls", "query"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
