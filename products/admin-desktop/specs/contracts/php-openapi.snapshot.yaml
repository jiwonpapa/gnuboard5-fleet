openapi: 3.0.3
info:
  title: Gnuboard5 REST API
  version: 1.0.0
  description: |
    Gnuboard5 REST API 명세.
    본 파일은 /api/v1/** 공개 계약의 SSOT이며 docs/API_SPEC.md와 함께 관리한다.
    /setup 같은 /api/v1 밖 운영 예외 경로는 docs/API_SPEC.md에서 별도로 설명한다.
servers:
  - url: /api/v1
    description: Relative API base path
tags:
  - name: Admin
    description: 관리자 대시보드
  - name: System
  - name: Auth
  - name: Board
  - name: Post
  - name: Comment
  - name: Member
  - name: Memo
    description: 쪽지
  - name: Like
  - name: File
  - name: Config
  - name: Menu
  - name: Point
  - name: Qa
  - name: Device
  - name: Notification
  - name: Poll
    description: 투표 (사용자)
  - name: Popup
    description: 팝업 (사용자)
  - name: Layout
  - name: Report
  - name: Block
  - name: "Admin: Auth"
    description: 관리자 권한 관리
  - name: "Admin: Boards"
    description: 관리자 게시판 관리
  - name: "Admin: Groups"
    description: 관리자 게시판 그룹 관리
  - name: "Admin: Members"
    description: 관리자 회원 관리
  - name: "Admin: Config"
    description: 관리자 사이트 설정
  - name: "Admin: Points"
    description: 관리자 포인트 관리
  - name: "Admin: Contents"
    description: 관리자 콘텐츠(인사말 등) 관리
  - name: "Admin: Faqs"
    description: 관리자 FAQ 관리
  - name: "Admin: Menus"
    description: 관리자 메뉴 관리
  - name: "Admin: Populars"
    description: 관리자 인기검색어 관리
  - name: "Admin: Visit"
    description: 관리자 방문자 통계
  - name: "Admin: Polls"
    description: 관리자 투표 관리
  - name: "Admin: Popups"
    description: 관리자 팝업 관리
  - name: "Admin: Mails"
    description: 관리자 메일 발송
  - name: "Admin: System"
    description: 관리자 시스템 운영/레거시 네임스페이스
  - name: "Admin: Layouts"
    description: 관리자 레이아웃/위젯 관리
  - name: "Admin: Reports"
    description: 관리자 신고 관리
  - name: "Admin: Push"
    description: 관리자 푸시 알림
  - name: "Admin: SMS"
    description: 관리자 SMS 설정/주소록/템플릿/발송 이력 관리
  - name: "Admin: QA"
    description: 관리자 1:1문의 관리
  - name: "Admin: WriteCount"
    description: 관리자 작성 수 통계
  - name: "Admin: Schema"
    description: 관리자 입력 필드 메타데이터
  - name: Plugin
paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service health response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /p/hello/greet:
    get:
      tags: [Plugin]
      summary: Hello 플러그인 인사말
      operationId: pluginHelloGreet
      security: []
      responses:
        '200':
          description: Hello 플러그인 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginHelloGreetResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /p/hello/info:
    get:
      tags: [Plugin]
      summary: Hello 플러그인 정보
      operationId: pluginHelloInfo
      security: []
      responses:
        '200':
          description: Hello 플러그인 메타데이터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginHelloInfoResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /p/premium-push/status:
    get:
      tags: [Plugin]
      summary: PremiumPush 상태 조회
      operationId: pluginPremiumPushStatus
      security: []
      responses:
        '200':
          description: PremiumPush 플러그인 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginPremiumPushStatusResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /p/premium-push/send:
    post:
      tags: [Plugin]
      summary: PremiumPush 발송 시뮬레이션
      description: "유효한 플러그인 라이선스가 있어야 호출할 수 있는 샘플 엔드포인트입니다. 표준 경로는 `/p/premium-push/messages`이며 이 경로는 레거시 호환용입니다."
      operationId: pluginPremiumPushSend
      security: []
      deprecated: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginPremiumPushSendRequest'
      responses:
        '200':
          description: 발송 시뮬레이션 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginPremiumPushSendResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/LicenseRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /p/premium-push/messages:
    post:
      tags: [Plugin]
      summary: PremiumPush 메시지 발송 시뮬레이션
      description: 표준 경로. 유효한 플러그인 라이선스가 있어야 호출할 수 있습니다.
      operationId: pluginPremiumPushCreateMessage
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginPremiumPushSendRequest'
      responses:
        '200':
          description: 발송 시뮬레이션 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginPremiumPushSendResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/LicenseRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /p/board-reward/boards/{bo_table}:
    get:
      tags: [Plugin]
      summary: BoardReward 게시판 메타 조회
      operationId: pluginBoardRewardShowBoard
      security: []
      parameters:
        - $ref: '#/components/parameters/boTable'
      responses:
        '200':
          description: 게시판 메타와 플러그인 scope 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginBoardRewardBoardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /p/board-reward/rewards/preview:
    post:
      tags: [Plugin]
      summary: BoardReward 지급 미리보기
      operationId: pluginBoardRewardPreview
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginBoardRewardCommand'
      responses:
        '200':
          description: 지급 검증 및 정규화 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginBoardRewardPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /p/board-reward/rewards/grant:
    post:
      tags: [Plugin]
      summary: BoardReward 포인트 지급
      description: "샘플 엔드포인트이며 `PLUGIN_BOARD_REWARD_ENABLE_GRANT=1` 설정 시에만 동작합니다. 표준 경로는 `/p/board-reward/reward-grants`이며 이 경로는 레거시 호환용입니다."
      operationId: pluginBoardRewardGrant
      security: []
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginBoardRewardCommand'
      responses:
        '200':
          description: 포인트 지급 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginBoardRewardGrantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /p/board-reward/reward-grants:
    post:
      tags: [Plugin]
      summary: BoardReward 보상 지급
      description: "표준 경로. `PLUGIN_BOARD_REWARD_ENABLE_GRANT=1` 설정 시에만 동작합니다."
      operationId: pluginBoardRewardCreateGrant
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginBoardRewardCommand'
      responses:
        '200':
          description: 포인트 지급 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginBoardRewardGrantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/availability/member-id:
    get:
      tags: [Auth]
      summary: 회원아이디 사용 가능 여부 확인
      operationId: checkMemberIdAvailability
      security: []
      parameters:
        - name: value
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 회원아이디 availability 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/availability/nick:
    get:
      tags: [Auth]
      summary: 닉네임 사용 가능 여부 확인
      operationId: checkNickAvailability
      security: []
      parameters:
        - name: value
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 닉네임 availability 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/availability/email:
    get:
      tags: [Auth]
      summary: 이메일 사용 가능 여부 확인
      operationId: checkEmailAvailability
      security: []
      parameters:
        - name: value
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: 이메일 availability 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/availability/phone:
    get:
      tags: [Auth]
      summary: 휴대폰 번호 사용 가능 여부 확인
      operationId: checkPhoneAvailability
      security: []
      parameters:
        - name: value
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 휴대폰 번호 availability 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/availability/recommender:
    get:
      tags: [Auth]
      summary: 추천인 사용 가능 여부 확인
      operationId: checkRecommenderAvailability
      security: []
      parameters:
        - name: value
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 추천인 availability 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: 토큰 갱신
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: 토큰 갱신 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/register:
    post:
      tags: [Auth]
      summary: 회원가입
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mb_id, mb_password, mb_name, mb_nick, mb_email]
              properties:
                mb_id:
                  type: string
                  pattern: '^[0-9A-Za-z_]{3,20}$'
                  minLength: 3
                  maxLength: 20
                mb_password:
                  type: string
                  minLength: 8
                mb_name:
                  type: string
                mb_nick:
                  type: string
                mb_email:
                  type: string
                  format: email
                mb_hp:
                  type: string
                mb_mailling:
                  type: boolean
                mb_sms:
                  type: boolean
                mb_open:
                  type: boolean
                mb_homepage:
                  type: string
                mb_tel:
                  type: string
                mb_zip:
                  type: string
                mb_zip1:
                  type: string
                mb_zip2:
                  type: string
                mb_addr1:
                  type: string
                mb_addr2:
                  type: string
                mb_addr3:
                  type: string
                mb_addr_jibeon:
                  type: string
                  enum: [R, J]
                mb_signature:
                  type: string
                mb_profile:
                  type: string
                mb_recommend:
                  type: string
                mb_marketing_agree:
                  type: boolean
                mb_thirdparty_agree:
                  type: boolean
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogoutRequest'
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/password/reset/request:
    post:
      tags: [Auth]
      summary: 비밀번호 재설정 요청
      operationId: requestPasswordReset
      security: []
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mb_email]
              properties:
                mb_id:
                  type: string
                  description: 동일 이메일 계정이 여러 개일 때 필수
                  pattern: '^[0-9A-Za-z_]{3,20}$'
                  minLength: 3
                  maxLength: 20
                mb_email:
                  type: string
                  format: email
      responses:
        '200':
          description: 비밀번호 재설정 토큰 발급 요청 수락
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/password-reset-requests:
    post:
      tags: [Auth]
      summary: 비밀번호 재설정 요청
      operationId: createPasswordResetRequest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mb_email]
              properties:
                mb_id:
                  type: string
                  description: 동일 이메일 계정이 여러 개일 때 필수
                  pattern: '^[0-9A-Za-z_]{3,20}$'
                  minLength: 3
                  maxLength: 20
                mb_email:
                  type: string
                  format: email
      responses:
        '200':
          description: 비밀번호 재설정 토큰 발급 요청 수락
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/password/reset/confirm:
    post:
      tags: [Auth]
      summary: 비밀번호 재설정 확정
      operationId: confirmPasswordReset
      security: []
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mb_id, reset_token, new_password]
              properties:
                mb_id:
                  type: string
                  pattern: '^[0-9A-Za-z_]{3,20}$'
                  minLength: 3
                  maxLength: 20
                reset_token:
                  type: string
                  minLength: 1
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: 비밀번호 재설정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/password-resets:
    post:
      tags: [Auth]
      summary: 비밀번호 재설정 확정
      operationId: createPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mb_id, reset_token, new_password]
              properties:
                mb_id:
                  type: string
                  pattern: '^[0-9A-Za-z_]{3,20}$'
                  minLength: 3
                  maxLength: 20
                reset_token:
                  type: string
                  minLength: 1
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: 비밀번호 재설정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
