components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    Location:
      description: 생성된 주 리소스의 API 경로
      schema:
        type: string

  parameters:
    boTable:
      name: bo_table
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 20
        pattern: '^[A-Za-z0-9_]+$'
    wrId:
      name: wr_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    commentId:
      name: comment_id
      in: path
      required: true
      schema:
        type: integer
    mbId:
      name: mb_id
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 20
        pattern: '^[A-Za-z0-9_]+$'
    grId:
      name: gr_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 10
        pattern: '^[A-Za-z0-9_]{1,10}$'
    bfNo:
      name: bf_no
      in: path
      required: true
      schema:
        type: integer
    deviceToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    pageId:
      name: page_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 50
        pattern: '^[A-Za-z0-9_-]+$'
    widgetId:
      name: widget_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 80
        pattern: '^[A-Za-z0-9_-]+$'
    reportId:
      name: report_id
      in: path
      required: true
      schema:
        type: integer
    externalProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 32
        pattern: '^[a-z][a-z0-9_-]{1,31}$'
    externalProviderUserId:
      name: provider_user_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 191

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: 요청 횟수 초과
      headers:
        Retry-After:
          description: 다시 요청할 수 있을 때까지의 초
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Limit:
          description: 현재 구간의 요청 한도
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Remaining:
          description: 현재 구간의 남은 요청 수
          schema:
            type: integer
            minimum: 0
        X-RateLimit-Reset:
          description: 요청 한도가 초기화되는 Unix timestamp
          schema:
            type: integer
            format: int64
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: SMS 저장소 또는 외부 공급자 미구성
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    LicenseRequired:
      description: 플러그인 라이선스 필요
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    Meta:
      type: object
      properties:
        request_id:
          type: string
        correlation_id:
          type: string
        server_request_id:
          type: string
        server_time:
          type: string
          format: date-time
        version:
          type: string
        error_code:
          type: string
        error_category:
          type: string
        fault_domain:
          type: string
        owner:
          type: string
        retryable:
